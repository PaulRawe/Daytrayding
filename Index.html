<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2c3e50"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Live-Trading Signale</title>
  <style>
    /* ... (dein bestehendes CSS bleibt unverändert) ... */
  </style>
</head>
<body>

  <div class="kapitalfeld">
    <div>
      <label for="capitalInput">Verfügbares Kapital (€):</label>
      <input type="number" id="capitalInput" value="1200" />
      <span id="capitalNotice">(Wird für Positionsgröße verwendet)</span>
    </div>
    <button class="btn" id="scanButton" onclick="ladeSignale(); ladeForexSignale();">
      Jetzt neu scannen
      <span id="spinner" style="display: none;" class="spinner"></span>
    </button>
  </div>

  <h1>Live-Trading Signale</h1>
  <div class="zeitinfo" id="scanTime">Letzter Scan: wird geladen…</div>
  <div id="signals"></div>

  <h2>Forex-Signale (24h handelbar)</h2>
  <div id="forexSignals"></div>

  <script>
    const capitalInput = document.getElementById("capitalInput");
    const spinner = document.getElementById("spinner");
    const scanButton = document.getElementById("scanButton");

    function berechnePositionsgröße(kapital) {
      kapital = parseFloat(kapital);
      if (isNaN(kapital) || kapital <= 0) return 0;
      return Math.min(kapital * 0.05, kapital >= 10000 ? 3000 : kapital);
    }

    async function ladeSignale() {
      spinner.style.display = "inline-block";
      scanButton.disabled = true;
      const container = document.getElementById("signals");
      const zeitinfo = document.getElementById("scanTime");
      container.innerHTML = "";

      try {
        const res = await fetch("signale.json?nocache=" + Date.now());
        const daten = await res.json();

        const kapital = parseFloat(capitalInput.value);
        const positionsgröße = berechnePositionsgröße(kapital);

        zeitinfo.textContent = "Letzter Scan: " + daten.zeitpunkt;

        daten.signale.forEach(signal => {
          const div = document.createElement("div");
          div.className = "signal " + signal.richtung.toLowerCase();
          div.innerHTML = `
            <strong>${signal.aktie}</strong> (${signal.land})<br/>
            Richtung: <b>${signal.richtung}</b><br/>
            Einstieg: <b>${signal.einstieg.toFixed(2)} €</b><br/>
            SL: ${signal.sl.toFixed(2)} €, TP: ${signal.tp.toFixed(2)} €<br/>
            Trefferquote: ${signal.trefferquote}%<br/>
            <div class="zertifikat">
              <b>Faktor-5-Zertifikat:</b><br/>
              Richtung: ${signal.zertifikat.typ}<br/>
              ISIN: <code>${signal.zertifikat.isin}</code><br/>
              Einstieg: ${signal.zertifikat.kurs_einstieg.toFixed(2)} €<br/>
              SL: ${signal.zertifikat.kurs_sl.toFixed(2)} €, TP: ${signal.zertifikat.kurs_tp.toFixed(2)} €
            </div>
            <div class="meta">
              <strong>Empfohlene Positionsgröße:</strong> ${positionsgröße.toLocaleString()} €
            </div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = "<p style='color:red;'>Fehler beim Laden der Aktiensignale.</p>";
        zeitinfo.textContent = "Letzter Scan: unbekannt";
      } finally {
        spinner.style.display = "none";
        scanButton.disabled = false;
      }
    }

    async function ladeForexSignale() {
      const container = document.getElementById("forexSignals");
      container.innerHTML = "";

      try {
        const res = await fetch("signale_forex.json?nocache=" + Date.now());
        const daten = await res.json();

        daten.signale.forEach(signal => {
          const div = document.createElement("div");
          div.className = "signal " + signal.richtung.toLowerCase();
          div.innerHTML = `
            <strong>${signal.waehrungspaar}</strong><br/>
            Richtung: <b>${signal.richtung}</b><br/>
            Einstieg: <b>${signal.einstieg.toFixed(4)}</b><br/>
            SL: ${signal.sl.toFixed(4)}, TP: ${signal.tp.toFixed(4)}<br/>
            Volatilität (30min): ${signal.volatilitaet_range}<br/>
            Trefferquote: ${signal.trefferquote}%<br/>
            <div class="zertifikat">
              <b>Faktor-${signal.zertifikat.hebel}-Zertifikat:</b><br/>
              Richtung: ${signal.zertifikat.typ}<br/>
              Einstieg: ${signal.zertifikat.kurs_einstieg.toFixed(4)}<br/>
              SL: ${signal.zertifikat.kurs_sl.toFixed(4)}, TP: ${signal.zertifikat.kurs_tp.toFixed(4)}
            </div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        container.innerHTML = "<p style='color:red;'>Forex-Signale konnten nicht geladen werden.</p>";
      }
    }

    capitalInput.addEventListener("input", () => {
      ladeSignale();
      ladeForexSignale();
    });

    ladeSignale();
    ladeForexSignale();

    setInterval(() => {
      ladeSignale();
      ladeForexSignale();
    }, 15000);

      window.add
